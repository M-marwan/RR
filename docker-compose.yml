services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rr_command_center}
      POSTGRES_USER: ${POSTGRES_USER:-rr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rr_secret_change_me}
    volumes:
      - ./data/postgres:/home/postgres/pgdata/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rr_admin} -d ${POSTGRES_DB:-rr_command_center}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    ports:
      - "6380:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
