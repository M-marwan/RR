[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rr-command-center-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    # Cache / locks
    "redis>=5.0.0",
    # Scheduler
    "apscheduler>=3.10.0",
    # Gmail API
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    # Email parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    # PDF parsing
    "pdfminer-six>=20221105",
    # Embeddings (local, no AI spend)
    "fastembed>=0.3.0",
    # Social / web
    "tweepy>=4.14.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    # Browser automation for paid portals
    "playwright>=1.43.0",
    # Data
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pendulum>=3.0.0",
    # Markdown parsing (for seeding RR system)
    "markdown>=3.6",
    # Auth — Microsoft Entra (Azure AD) JWT validation
    "python-jose[cryptography]>=3.3.0",
    # DB migrations (already in deps via alembic above; explicit version pin)
]

[tool.hatch.envs.default.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
migrate = "alembic upgrade head"
makemigration = "alembic revision -m"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
