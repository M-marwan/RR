# Alembic configuration for RR Command Center backend.
# Run migrations from the backend/ directory:
#     cd backend
#     alembic upgrade head           # apply all pending migrations
#     alembic stamp 0001             # mark an existing DB at the baseline (one-time, for DBs created from schema.sql before alembic was introduced)
#     alembic revision -m "msg"      # create a new empty migration
#     alembic downgrade -1           # roll back one migration

[alembic]
script_location = app/db/migrations
prepend_sys_path = .

# DB URL is loaded at runtime from app.config.get_settings() in env.py — leave blank here.
sqlalchemy.url =

# Use timezone-aware UTC timestamps in revision filenames
timezone = UTC

# Don't truncate revision IDs (we use 4-digit zero-padded ints, e.g. 0001, 0002, ...)
truncate_slug_length = 40

# We keep our schema in pure SQL (schema.sql) for the baseline; alembic owns deltas from 0002 onward.
# Detect new SQL types and server defaults when autogenerating.
compare_type = true
compare_server_default = true

[post_write_hooks]
# Black formatting on new migrations would be nice but we don't depend on black yet.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
